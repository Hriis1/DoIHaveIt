<section class="add-credit-screen" aria-labelledby="add-credit-title">
  <h1 id="add-credit-title">Add credit</h1>
  <p class="credit-packs-description">Choose a credit pack for AI searches.</p>
  <p class="credit-packs-status" role="status">Loading credit packs…</p>
  <p class="credit-packs-error error" role="alert" hidden></p>
  <button class="secondary-button credit-packs-retry" type="button" hidden>Try again</button>
  <div class="credit-packs" aria-busy="true"></div>
  <p class="credit-packs-note" role="status" hidden></p>
  <button class="secondary-button credit-packs-check" type="button" hidden>Check again</button>
  <dialog class="credit-result-dialog" aria-labelledby="credit-result-message">
    <div class="sheet">
      <button class="popup-close credit-result-close" type="button" aria-label="Close purchase result"><svg aria-hidden="true"><use href="#icon-close" /></svg></button>
      <div class="credit-result-content">
        <p id="credit-result-message" role="status"></p>
        <svg class="credit-result-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path class="credit-result-symbol" pathLength="1" />
        </svg>
      </div>
    </div>
  </dialog>
  <template class="credit-pack-template">
    <article class="credit-pack">
      <div class="credit-pack-details">
        <svg aria-hidden="true"><use href="#icon-coins" /></svg>
        <h2 class="credit-pack-title"></h2>
      </div>
      <button class="primary-button credit-pack-price" type="button"></button>
    </article>
  </template>
</section>
