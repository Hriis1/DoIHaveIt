<section class="collection-screen" aria-labelledby="collection-title">
  <button class="collection-back" type="button"><svg aria-hidden="true"><use href="#icon-arrow-left" /></svg>Collections</button>
  <header class="gallery-heading">
    <h1 id="collection-title"></h1>
    <p class="gallery-count"></p>
  </header>

  <div class="gallery-search">
    <svg aria-hidden="true"><use href="#icon-search" /></svg>
    <label for="item-search" class="gallery-sr">Search items</label>
    <input id="item-search" type="search" placeholder="Search in this collection" autocomplete="off" />
  </div>

  <p class="gallery-message" role="status">Loading items…</p>
  <p class="gallery-error error" role="alert" hidden></p>
  <div class="item-gallery" aria-label="Collection items" aria-busy="true"></div>
  <section class="gallery-empty" hidden>
    <svg aria-hidden="true"><use href="#icon-image" /></svg>
    <h2></h2>
    <p></p>
  </section>

  <footer class="gallery-footer">
    <nav class="gallery-pagination" aria-label="Item pages">
      <button class="gallery-previous secondary-button" type="button" aria-label="Previous page" disabled><svg aria-hidden="true"><use href="#icon-chevron-left" /></svg></button>
      <span class="gallery-page" role="status" aria-live="polite"></span>
      <button class="gallery-next secondary-button" type="button" aria-label="Next page" disabled><svg aria-hidden="true"><use href="#icon-chevron-right" /></svg></button>
    </nav>
    <p class="gallery-range"></p>
    <button class="gallery-scan primary-button" type="button"><svg aria-hidden="true"><use href="#icon-scan" /></svg>Scan and add</button>
  </footer>

  <dialog class="scan-result-dialog" aria-labelledby="scan-result-title" aria-describedby="scan-result-barcode">
    <div class="sheet">
      <button class="popup-close scan-result-close" type="button" aria-label="Close scan result"><svg aria-hidden="true"><use href="#icon-close" /></svg></button>
      <h2 id="scan-result-title" role="status" aria-live="polite">Looking up product…</h2>
      <p id="scan-result-barcode"></p>
      <p class="error scan-result-error" role="alert" hidden></p>
      <a class="scan-result-buy-credits" href="#" hidden>Buy credits</a>
      <div class="scan-result-product" hidden>
        <dl class="scan-product-details">
          <div>
            <dt><label for="scan-brand-input">Brand</label></dt>
            <dd>
              <span class="scan-product-brand"></span>
              <div class="scan-manual-select scan-brand-select" hidden>
                <input id="scan-brand-input" type="text" autocomplete="off" required aria-describedby="scan-brand-error" hidden />
                <button id="scan-brand-toggle" class="scan-options-toggle" type="button" aria-label="Show brands" aria-controls="scan-brand-options" aria-haspopup="listbox" aria-expanded="false"><svg aria-hidden="true"><use href="#icon-chevron-down" /></svg></button>
                <div id="scan-brand-options" class="scan-manual-options" role="listbox" aria-label="Brands" hidden></div>
              </div>
              <p class="error scan-brand-error" id="scan-brand-error" role="alert" hidden></p>
            </dd>
          </div>
          <div>
            <dt><label for="scan-name-input">Name</label></dt>
            <dd>
              <span class="scan-product-name"></span>
              <div class="scan-manual-select scan-name-select" hidden>
                <input id="scan-name-input" type="text" autocomplete="off" required aria-describedby="scan-name-error" hidden />
                <button id="scan-name-toggle" class="scan-options-toggle" type="button" aria-label="Show product names" aria-controls="scan-name-options" aria-haspopup="listbox" aria-expanded="false"><svg aria-hidden="true"><use href="#icon-chevron-down" /></svg></button>
                <div id="scan-name-options" class="scan-manual-options" role="listbox" aria-label="Product names" hidden></div>
              </div>
              <p class="error scan-name-error" id="scan-name-error" role="alert" hidden></p>
            </dd>
          </div>
          <div class="scan-product-size-row">
            <dt><label for="scan-size-input">Size</label></dt>
            <dd>
              <span class="scan-product-size"></span>
              <div class="scan-manual-select scan-size-select" hidden>
                <input id="scan-size-input" type="text" placeholder="Optional" autocomplete="off" hidden />
                <button id="scan-size-toggle" class="scan-options-toggle" type="button" aria-label="Show sizes" aria-controls="scan-size-options" aria-haspopup="listbox" aria-expanded="false"><svg aria-hidden="true"><use href="#icon-chevron-down" /></svg></button>
                <div id="scan-size-options" class="scan-manual-options" role="listbox" aria-label="Sizes" hidden></div>
              </div>
            </dd>
          </div>
          <div class="scan-product-photo-row">
            <dt>Photo</dt>
            <dd class="scan-photo-controls">
              <span class="scan-photo-preview" role="img" aria-label="No photo selected"></span>
              <div class="scan-photo-actions">
                <button class="secondary-button scan-photo-camera" type="button" aria-label="Take a photo" aria-describedby="scan-photo-error"><svg aria-hidden="true"><use href="#icon-camera" /></svg></button>
                <button class="secondary-button scan-photo-gallery" type="button" aria-label="Choose from gallery" aria-describedby="scan-photo-error"><svg aria-hidden="true"><use href="#icon-image" /></svg></button>
              </div>
            </dd>
          </div>
        </dl>
        <p class="error scan-photo-error" id="scan-photo-error" role="alert" hidden></p>
      </div>
      <button class="primary-button scan-result-add" type="button" hidden>Add to collection</button>
      <button class="primary-button scan-result-dismiss" type="button" hidden>Close</button>
      <div class="scan-result-actions" hidden>
        <button class="secondary-button scan-result-manual" type="button" hidden>Add manually</button>
        <button class="primary-button scan-result-ai-search" type="button" hidden>AI Search</button>
      </div>
    </div>
  </dialog>

  <template class="item-template">
    <button class="item-open" type="button">
      <figure class="gallery-item">
        <div class="item-image">
          <span class="image-placeholder"><svg aria-hidden="true"><use href="#icon-image" /></svg></span>
        </div>
        <figcaption class="item-label"></figcaption>
      </figure>
    </button>
  </template>

  <dialog class="item-detail-dialog" aria-labelledby="item-detail-title">
    <div class="sheet">
      <button class="popup-close item-detail-close" type="button" aria-label="Close product details"><svg aria-hidden="true"><use href="#icon-close" /></svg></button>
      <div class="item-image item-detail-image">
        <span class="image-placeholder"><svg aria-hidden="true"><use href="#icon-image" /></svg></span>
      </div>
      <h2 id="item-detail-title">Product details</h2>
      <dl class="item-detail-fields">
        <div><dt>Brand</dt><dd class="item-detail-brand"></dd></div>
        <div><dt>Name</dt><dd class="item-detail-name"></dd></div>
        <div class="item-detail-size-row"><dt>Size</dt><dd class="item-detail-size"></dd></div>
      </dl>
      <p class="error item-detail-error" role="alert" hidden></p>
      <button class="danger-button item-detail-remove" type="button">Remove from collection</button>
    </div>
  </dialog>
</section>
