<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DoIHaveIt</title>
  </head>
  <body>
    <main id="app">
      <header class="app-header">
        <button class="brand" type="button" aria-label="DoIHaveIt — Collections"><svg aria-hidden="true"><use href="#icon-layers" /></svg>DoIHaveIt</button>
        <details class="app-menu">
          <summary aria-label="App menu"><svg aria-hidden="true"><use href="#icon-menu" /></svg></summary>
          <div class="app-menu-dropdown">
            <button type="button" data-screen="catalogs">Catalogs</button>
            <button type="button" data-screen="products">Products</button>
          </div>
        </details>
      </header>
      <div id="screen-content"></div>
    </main>

    <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="icon-layers" viewBox="0 0 24 24"><path d="m12 3 10 6-10 6L2 9l10-6ZM2 15l10 6 10-6" /></symbol>
      <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></symbol>
      <symbol id="icon-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M9.5 9a2.5 2.5 0 0 1 5 .5c0 1.5-2.5 2-2.5 3.5M12 16h.01" /></symbol>
      <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 15v5h16v-5" /></symbol>
      <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
      <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h5l2 4h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" /></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7" /></symbol>
      <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="m12 5-7 7 7 7M5 12h14" /></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m16 16 5 5" /></symbol>
      <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6" /></symbol>
      <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" /></symbol>
      <symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="8" cy="8" r="1" /><path d="m3 17 5-5 4 4 4-6 5 7" /></symbol>
      <symbol id="icon-camera" viewBox="0 0 24 24"><path d="M9 4h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h3l2-3Z" /><circle cx="12" cy="13" r="4" /></symbol>
      <symbol id="icon-scan" viewBox="0 0 24 24"><path d="M8 3H4a1 1 0 0 0-1 1v4M16 3h4a1 1 0 0 1 1 1v4M21 16v4a1 1 0 0 1-1 1h-4M8 21H4a1 1 0 0 1-1-1v-4M7 7v10M10 7v10M14 7v10M17 7v10" /></symbol>
    </svg>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
