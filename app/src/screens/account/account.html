<section class="account-screen" aria-labelledby="account-title">
  <h1 id="account-title">Account</h1>
  <p class="account-status" role="status">Loading account…</p>
  <p class="account-error error" role="alert" hidden></p>
  <div class="account-details" hidden>
    <dl class="account-summary">
      <dt>Email</dt>
      <dd class="account-email"></dd>
      <dt>Credit balance</dt>
      <dd class="account-balance"></dd>
    </dl>
    <button class="primary-button" type="button">Add credit</button>
  </div>
</section>
