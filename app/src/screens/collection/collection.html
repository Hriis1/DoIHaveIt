<section class="collection-screen" aria-labelledby="collection-title">
  <button class="collection-back" type="button"><svg aria-hidden="true"><use href="#icon-arrow-left" /></svg>Collections</button>
  <header class="gallery-heading">
    <h1 id="collection-title"></h1>
    <p class="gallery-count"></p>
  </header>

  <div class="gallery-search">
    <svg aria-hidden="true"><use href="#icon-search" /></svg>
    <label for="item-search" class="gallery-sr">Search items</label>
    <input id="item-search" type="search" placeholder="Search in this collection" autocomplete="off" />
  </div>

  <p class="gallery-message" role="status">Loading items…</p>
  <p class="gallery-error error" role="alert" hidden></p>
  <div class="item-gallery" aria-label="Collection items" aria-busy="true"></div>
  <section class="gallery-empty" hidden>
    <svg aria-hidden="true"><use href="#icon-image" /></svg>
    <h2></h2>
    <p></p>
  </section>

  <footer class="gallery-footer">
    <nav class="gallery-pagination" aria-label="Item pages">
      <button class="gallery-previous secondary-button" type="button" aria-label="Previous page" disabled><svg aria-hidden="true"><use href="#icon-chevron-left" /></svg></button>
      <span class="gallery-page" role="status" aria-live="polite"></span>
      <button class="gallery-next secondary-button" type="button" aria-label="Next page" disabled><svg aria-hidden="true"><use href="#icon-chevron-right" /></svg></button>
    </nav>
    <p class="gallery-range"></p>
    <button class="gallery-scan primary-button" type="button"><svg aria-hidden="true"><use href="#icon-scan" /></svg>Scan and add</button>
  </footer>

  <dialog class="scan-result-dialog" aria-labelledby="scan-result-title" aria-describedby="scan-result-barcode">
    <div class="sheet">
      <button class="scan-result-close" type="button" aria-label="Close scan result"><svg aria-hidden="true"><use href="#icon-close" /></svg></button>
      <h2 id="scan-result-title" role="status" aria-live="polite">Looking up product…</h2>
      <p id="scan-result-barcode"></p>
      <div class="scan-result-product" hidden>
        <dl class="scan-product-details">
          <div><dt>Brand</dt><dd class="scan-product-brand"></dd></div>
          <div><dt>Name</dt><dd class="scan-product-name"></dd></div>
          <div class="scan-product-size-row"><dt>Size</dt><dd class="scan-product-size"></dd></div>
          <div class="scan-product-photo-row">
            <dt>Photo</dt>
            <dd class="scan-photo-controls">
              <span class="scan-photo-preview" role="img" aria-label="No photo selected"></span>
              <div class="scan-photo-actions">
                <button class="secondary-button scan-photo-camera" type="button" aria-label="Take a photo" aria-describedby="scan-photo-error"><svg aria-hidden="true"><use href="#icon-camera" /></svg></button>
                <button class="secondary-button scan-photo-gallery" type="button" aria-label="Choose from gallery" aria-describedby="scan-photo-error"><svg aria-hidden="true"><use href="#icon-image" /></svg></button>
              </div>
            </dd>
          </div>
        </dl>
        <p class="error scan-photo-error" id="scan-photo-error" role="alert" hidden></p>
      </div>
      <button class="primary-button scan-result-add" type="button" hidden>Add to collection</button>
      <button class="primary-button scan-result-dismiss" type="button" hidden>Close</button>
      <button class="primary-button scan-result-ai-search" type="button" hidden>AI Search</button>
    </div>
  </dialog>

  <template class="item-template">
    <figure class="gallery-item">
      <div class="item-image">
        <span class="image-placeholder"><svg aria-hidden="true"><use href="#icon-image" /></svg></span>
      </div>
      <figcaption class="item-label"></figcaption>
    </figure>
  </template>
</section>
