<section class="ai-provider-screen" aria-labelledby="ai-provider-title">
  <header class="ai-provider-heading">
    <h1 id="ai-provider-title">AI Search</h1>
    <p>Choose a provider and manage your API keys.</p>
  </header>

  <form class="ai-provider-form">
    <fieldset class="ai-provider-fields">
      <legend class="ai-provider-sr">Provider settings</legend>
      <div class="ai-provider-modes">
        <label><input type="radio" name="ai-key-source" value="app" checked /> Use app’s key <span>Gemini</span></label>
        <label><input type="radio" name="ai-key-source" value="own" /> Use my own key</label>
      </div>

      <div class="ai-provider-own" hidden>
        <label class="ai-provider-label" for="ai-provider">Provider</label>
        <select id="ai-provider">
          <option value="gemini">Gemini</option>
          <option value="deepseek">DeepSeek</option>
          <option value="openai">OpenAI</option>
        </select>

        <p class="ai-key-status" role="status"></p>
        <label class="ai-provider-label" for="ai-api-key">API key</label>
        <div class="ai-key-input">
          <input id="ai-api-key" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="ai-key-help" placeholder="Paste your API key" />
          <button class="ai-key-visibility" type="button" aria-label="Show API key" aria-pressed="false"><svg aria-hidden="true"><use href="#icon-eye" /></svg></button>
        </div>
        <p id="ai-key-help">Paste a key from your provider’s website. Saving a new key replaces the saved one for this provider.</p>
        <div class="ai-key-actions">
          <button class="primary-button ai-key-save" type="submit">Save key</button>
          <button class="secondary-button ai-key-remove" type="button" disabled>Remove saved key</button>
        </div>
      </div>
    </fieldset>
  </form>

  <p class="ai-provider-browser" hidden>In the browser, keys are kept only until you refresh or close the page.</p>
  <p class="ai-provider-message" role="status"></p>
  <p class="ai-provider-error error" role="alert" hidden></p>
</section>
